<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fabrica de Fotolibros</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="logo-section">
            <div class="logo">
                <div class="logo-icon">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 28L20 16L32 28H8Z" fill="white"/>
                        <path d="M12 32L20 24L28 32H12Z" fill="white"/>
                    </svg>
                </div>
                <div class="logo-text">
                    <div class="logo-title">FABRICA DE</div>
                    <div class="logo-subtitle">FOTOLIBROS</div>
                </div>
            </div>
        </div>
        
        <div class="content-section">
            <h1 class="main-heading">Hacé tu fotolibro online</h1>
            <p class="description">
                Diseña tu fotolibro y otros productos online, sin necesidad de instalar ningún software en tu computadora. Solo tenés que estar registrado y logueado en nuestro sistema.
            </p>
            <button class="cta-button">Entrar</button>
        </div>
    </div>
</body>
</html>
